# Every job submitted from the master container picks these up.
spark.master                     spark://spark-master:7077
# relative paths like /lake/bronze resolve to HDFS
spark.hadoop.fs.defaultFS        hdfs://namenode:8020
# 2 workers x 2 cores: one executor per worker
spark.executor.memory            1g
spark.executor.cores             2
spark.driver.memory              1g
# default is 200, far too many for our data size - tuned properly in phase 3
spark.sql.shuffle.partitions     8
