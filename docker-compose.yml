name: supplychainx

services:
  # Kafka in KRaft mode - no Zookeeper needed anymore.
  # Two listeners: kafka:19092 for other containers, localhost:9092 for scripts on your machine.
  kafka:
    image: apache/kafka:3.8.0
    container_name: scx-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: scx-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: supplychainx
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  postgres:
    image: postgres:16
    container_name: scx-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # anything in here runs once, the first time the volume is created
      - ./db/init:/docker-entrypoint-initdb.d:ro

  neo4j:
    image: neo4j:5.26-community
    container_name: scx-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt (what the python driver talks to)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data

  # ---------- Hadoop HDFS: the data lake storage ----------
  # NameNode keeps the "index" (which file is made of which blocks, and where they are).
  # DataNodes store the actual blocks. With replication=2 each block lives on both.
  namenode:
    image: apache/hadoop:3.4.1
    container_name: scx-namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # HDFS web UI
    env_file: hadoop.env
    environment:
      # formats a fresh filesystem the first time (when this folder doesn't exist yet)
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    volumes:
      - hdfs-name:/tmp/hadoop-root
      # local bronze files, so we can copy them into HDFS from inside the cluster
      - ./data:/landing:ro

  datanode1:
    image: apache/hadoop:3.4.1
    container_name: scx-datanode1
    hostname: datanode1
    user: root
    command: ["hdfs", "datanode"]
    env_file: hadoop.env
    depends_on: [namenode]
    volumes:
      - hdfs-data1:/tmp/hadoop-root

  datanode2:
    image: apache/hadoop:3.4.1
    container_name: scx-datanode2
    hostname: datanode2
    user: root
    command: ["hdfs", "datanode"]
    env_file: hadoop.env
    depends_on: [namenode]
    volumes:
      - hdfs-data2:/tmp/hadoop-root

  # ---------- Apache Spark: standalone cluster ----------
  # Master hands out work, workers run it. Jobs are submitted from the master container.
  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: scx-spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8081:8080"   # master UI (8080 is taken by kafka-ui)
      - "4040:4040"   # UI of the job currently running
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark_jobs:/opt/scx/spark_jobs:ro
      - ./data:/opt/scx/data

  spark-worker-1:
    image: apache/spark:3.5.3-python3
    container_name: scx-spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1536m
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

  spark-worker-2:
    image: apache/spark:3.5.3-python3
    container_name: scx-spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1536m
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

volumes:
  kafka-data:
  pg-data:
  neo4j-data:
  hdfs-name:
  hdfs-data1:
  hdfs-data2:
